continuous_trajectory_optimizer:
  spatial_speed_envelope: true
  max_speed_mps: 0.50
  max_acceleration_mps2: 0.12
  max_deceleration_mps2: 0.18
  max_jerk_mps3: 0.20
  max_lateral_acceleration_mps2: 0.12
  max_curvature_rate_1pmps: 2.50

# Online Hybrid A* paths use this separate parameterizer.
trajectory_optimizer:
  max_speed_mps: 0.50
  max_acceleration_mps2: 0.12
  max_deceleration_mps2: 0.18
  max_lateral_acceleration_mps2: 0.12
  high_curvature_threshold_1pm: 0.50
  high_curvature_speed_limit_mps: 0.25
