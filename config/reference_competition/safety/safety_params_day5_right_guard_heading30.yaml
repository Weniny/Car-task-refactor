safety:
  command_output_topic: /cmd_vel_safe
  command_timeout_s: 0.15
  state_timeout_s: 0.15
  system_state_timeout_s: 0.20
  max_speed_mps: 0.20
  max_acceleration_mps2: 0.20
  max_deceleration_mps2: 0.30
  min_turning_radius_m: 0.60
  recovery_lateral_error_m: 0.10
  recovery_heading_error_deg: 10.0
  recovery_clear_lateral_error_m: 0.06
  recovery_clear_heading_error_deg: 5.0
  recovery_speed_mps: 0.06
  max_lateral_error_m: 0.40
  max_heading_error_deg: 45.0
  tracking_error_timeout_s: 1.0
  require_can_control_mode: true
  require_system_state: true
  require_dual_ackermann_mode: true
  avoidance_stop_topic: /avoidance/stop_request
  require_avoidance_source: true
  avoidance_timeout_s: 0.35
  traffic_rules_stop_topic: /perception/traffic_stop_request
  require_traffic_rules: false
  traffic_rules_timeout_s: 1.0
  on_fault: SAFE_HOLD

pointcloud_to_laserscan:
  input_topic: /cloud_registered_body
  output_topic: /scan
  target_frame: body
  transform_tolerance: 0.10
  min_height: -0.25
  max_height: 0.80
  angle_min: -3.141592653589793
  angle_max: 3.141592653589793
  angle_increment: 0.008726646259972
  scan_time: 0.10
  range_min: 0.10
  range_max: 6.00
  use_inf: true
  inf_epsilon: 1.0
  concurrency_level: 1

proximity_stop:
  input_type: laser_scan
  input_scan_topic: /scan
  scan_qos_reliability: best_effort
  scan_qos_depth: 1
  stop_request_topic: /avoidance/stop_request
  status_topic: /avoidance/proximity_status
  costmap_topic: /avoidance/local_costmap
  scan_topic: /avoidance/scan
  marker_topic: /avoidance/markers
  visualization_rate_hz: 5.0
  fusion_frame_count: 10
  expected_frame_id: body
  max_scan_age_s: 0.25
  x_min_m: 0.25
  stop_distance_m: 0.70
  front_half_angle_rad: 0.4363
  lateral_half_width_m: 0.60
  z_min_m: -0.25
  z_max_m: 0.80
  min_points: 3
  grid_resolution_m: 0.05
  grid_x_min_m: -0.50
  grid_x_max_m: 5.50
  grid_y_min_m: -2.50
  grid_y_max_m: 2.50
  grid_inflation_radius_m: 0.20
  scan_bin_count: 360
  scan_range_min_m: 0.10
  scan_range_max_m: 6.00
  vehicle_length_m: 0.72
  vehicle_width_m: 0.50
