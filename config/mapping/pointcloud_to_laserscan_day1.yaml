pointcloud_to_laserscan:
  ros__parameters:
    target_frame: body
    transform_tolerance: 0.10
    min_height: -0.30
    max_height: 0.30
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.00873
    scan_time: 0.10
    range_min: 0.25
    range_max: 20.0
    use_inf: true
    inf_epsilon: 1.0
    concurrency_level: 1
