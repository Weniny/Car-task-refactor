/**:
  ros__parameters:
    # Low-load diagnostic profile: retain one in every six incoming points.
    # Keep scan_rate at the MID-360 hardware rate; the driver output rate is
    # selected independently by the bringup launch argument.
    feature_extract_enable: false
    point_filter_num: 6
    max_iteration: 3
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000.0
    runtime_pos_log_enable: true
    map_file_path: "/home/agilex/competition_rebuild_ws/maps/fast_lio/day1_fast_lio.pcd"

    common:
      lid_topic: "/livox/lidar"
      imu_topic: "/livox/imu"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0

    preprocess:
      lidar_type: 1
      scan_line: 4
      blind: 0.5
      timestamp_unit: 3
      scan_rate: 5

    mapping:
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 360.0
      det_range: 100.0
      # The LiDAR-IMU extrinsic calibration is fixed above.  Do not let
      # online estimation absorb weak-scene/low-motion degeneracy into the
      # pose estimate during runtime localization.
      extrinsic_est_en: false
      extrinsic_T: [-0.011, -0.02329, 0.04412]
      extrinsic_R: [1., 0., 0., 0., 1., 0., 0., 0., 1.]

    publish:
      path_en: true
      effect_map_en: false
      map_en: true
      scan_publish_en: true
      dense_publish_en: false
      scan_bodyframe_pub_en: true

    pcd_save:
      pcd_save_en: true
      interval: -1
