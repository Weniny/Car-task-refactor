slam_toolbox:
  ros__parameters:
    use_sim_time: false
    odom_frame: camera_init
    map_frame: map
    base_frame: body
    scan_topic: /scan
    mode: mapping
    resolution: 0.03
    transform_publish_period: 0.02
    map_update_interval: 1.0
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
