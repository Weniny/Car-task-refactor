amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: body
    odom_frame_id: camera_init
    global_frame_id: map
    scan_topic: /localization/scan
    tf_broadcast: true
    set_initial_pose: false
    transform_tolerance: 0.20

    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.02

    laser_model_type: likelihood_field
    laser_min_range: 0.20
    laser_max_range: 20.0
    laser_likelihood_max_dist: 2.0
    max_beams: 180
    sigma_hit: 0.20
    z_hit: 0.75
    z_rand: 0.20
    z_short: 0.025
    z_max: 0.025
    do_beamskip: true
    beam_skip_distance: 0.50
    beam_skip_threshold: 0.30
    beam_skip_error_threshold: 0.90

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    save_pose_rate: 0.5
    update_min_a: 0.05
    update_min_d: 0.05
